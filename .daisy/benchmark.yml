on:
  push:
    branches:
      - master

parameters:
  timeout: 15
  partitions:
    - bellis4

steps:
  build: |
    # Update and install dependencies
    apt-get update
    apt-get install -y build-essential

    # Compile the benchmark
    gcc -O2 -g pow/main.c pow/pow_*.c -o pow/main.out

  run:
    power:
      command: ./pow/main.out
      measurements: 1
      profiler: perf
      metrics:
        - flops_dp
        - memory_bandwidth
